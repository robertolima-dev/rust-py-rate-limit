name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # O lint faz parte do portão de release, não de um workflow paralelo.
  # Nos repositórios de workflow único, um `lint` vermelho ao lado de uma
  # publicação bem-sucedida seria ruído difícil de ler — a leitura passa a ser
  # inequívoca: vermelho significa que não publicou.
  #
  # A toolchain é fixa, não "stable": com `-D warnings`, um clippy mais novo
  # no runner reprova código que ninguém tocou, e a CI ficaria vermelha por
  # conta do calendário. Subir este número vira uma mudança deliberada.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      # clippy só checa tipos, não linka, então --all-features é seguro aqui
      # (diferente do `cargo test`, que precisa de --no-default-features).
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  rust-tests:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      # fmt e clippy saíram daqui para o job `lint` (P1-6): toolchain fixa e
      # --all-features, na mesma forma dos outros quatro projetos.
      - name: cargo test
        run: cargo test

  python-tests:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Swatinem/rust-cache@v2
      - name: Install package + dev dependencies
        # `pip install` uses the maturin build backend to compile and install
        # the extension. Unlike `maturin develop`, it does not require an active
        # virtualenv, so it works directly against the runner's Python.
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Run pytest
        run: pytest -q

  build-wheels:
    name: build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist
