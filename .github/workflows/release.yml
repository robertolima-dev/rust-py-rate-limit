name: Release

# Builds wheels + sdist for all platforms and publishes them.
#
#  * Pushing a tag like `v0.1.0` publishes to PyPI.
#  * Manual runs (workflow_dispatch) publish to TestPyPI, so you can validate
#    the release flow before cutting a real tag.
#
# Publishing uses PyPI "trusted publishing" (OIDC); configure the publisher in
# your PyPI / TestPyPI project settings — no API tokens needed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # O lint faz parte do portão de release, não de um workflow paralelo.
  # Nos repositórios de workflow único, um `lint` vermelho ao lado de uma
  # publicação bem-sucedida seria ruído difícil de ler — a leitura passa a ser
  # inequívoca: vermelho significa que não publicou.
  #
  # A toolchain é fixa, não "stable": com `-D warnings`, um clippy mais novo
  # no runner reprova código que ninguém tocou, e a CI ficaria vermelha por
  # conta do calendário. Subir este número vira uma mudança deliberada.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      # clippy só checa tipos, não linka, então --all-features é seguro aqui
      # (diferente do `cargo test`, que precisa de --no-default-features).
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # CI.yml runs on push/PR, but it is a *separate* workflow: a tag push used to
  # go straight to build-and-publish without any of it. This job is what makes
  # the release itself conditional on a green suite — publishing to PyPI is
  # irreversible, so it must never happen on unverified code.
  test:
    name: Test (Rust + Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      # fmt and clippy moved out into the `lint` job above, so that all five
      # projects share one shape (P1-6). They also now pin the toolchain and
      # pass --all-features.
      # extension-module is not enabled in Cargo.toml (maturin turns it on via
      # [tool.maturin].features), so the test binary links libpython normally.
      - name: cargo test
        run: cargo test
      - name: Build, install the extension and run the Python tests
        # `pip install` drives the maturin build backend, so it compiles the
        # extension and installs it into the runner's Python — no virtualenv
        # needed, unlike `maturin develop`.
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pytest -q

  # The matrix below replaces a single `build` job that ran on
  # ubuntu/macos/windows with the runner's own Python 3.12. That produced three
  # wheels, all cp312, and the Linux one picked up the runner's glibc
  # (manylinux_2_34) instead of going through a manylinux container. Everyone on
  # another Python, on aarch64, on musl, or on an older glibc fell back to
  # compiling the sdist — which needs a Rust toolchain.
  #
  # With abi3-py310 each target now yields one wheel that covers CPython 3.10
  # and every later version.
  linux:
    runs-on: ubuntu-latest
    needs: [test, lint]
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          # `auto` builds inside the manylinux container, so the wheel declares
          # a portable glibc floor rather than the runner's.
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  musllinux:
    runs-on: ubuntu-latest
    needs: [test, lint]
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: musllinux_1_2
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          architecture: x64
      - uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist

  macos:
    runs-on: macos-latest
    needs: [test, lint]
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    name: build sdist
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: [lint, test, linux, musllinux, windows, macos, sdist]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test, linux, musllinux, windows, macos, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A sanity check before anything leaves the runner: publishing an
      # incomplete set is worse than not publishing, because PyPI never lets a
      # filename be reused — a half-uploaded version can only be completed,
      # never replaced.
      - name: Verify the artifact set is complete
        run: |
          set -euo pipefail
          ls -la dist/
          test -n "$(find dist -name '*.tar.gz' -print -quit)" \
            || { echo "::error::sdist ausente — abortando antes de publicar"; exit 1; }
          wheels=$(find dist -name '*.whl' | wc -l)
          echo "wheels: $wheels"
          test "$wheels" -ge 7 \
            || { echo "::error::só $wheels wheels; esperado >= 7 (2 linux, 2 musl, 1 win, 2 macos)"; exit 1; }

      # PyPI returns a transient 500 often enough to matter, and the upload is
      # file-by-file: a failure halfway leaves the version published in part.
      # `skip-existing` is what makes a second attempt safe — without it the
      # retry dies on the files that did make it the first time.
      #
      # This is two explicit steps rather than a retry wrapper because
      # trusted publishing (OIDC) needs the official action, which cannot be
      # driven from a shell command.
      - name: Publish to PyPI (attempt 1)
        id: publish1
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Wait before retrying
        if: steps.publish1.outcome == 'failure'
        run: sleep 45

      - name: Publish to PyPI (attempt 2)
        if: steps.publish1.outcome == 'failure'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      # Proves the release is actually complete, rather than trusting an exit
      # code that a partial upload can still produce.
      - name: Verify every file reached PyPI
        run: |
          set -euo pipefail
          python -m pip install --quiet requests
          python - <<'PY'
          import os, sys, glob, time, requests
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          # Só .whl e .tar.gz: são os únicos tipos de arquivo que o PyPI hospeda.
          # `pypa/gh-action-pypi-publish` deixa um .publish.attestation por
          # distribuição em dist/ depois de publicar (atestados PEP 740, que
          # sobem junto do arquivo, não como arquivo próprio). Um glob amplo os
          # conta como "faltando no PyPI" e reprova uma release que deu certo.
          local = {
              os.path.basename(p)
              for pattern in ("dist/*.whl", "dist/*.tar.gz")
              for p in glob.glob(pattern)
          }
          url = f"https://pypi.org/pypi/rust-py-rate-limit/{version}/json"
          for attempt in range(6):          # PyPI's JSON API is cached
              response = requests.get(url, timeout=30)
              if response.status_code == 200:
                  remote = {f["filename"] for f in response.json()["urls"]}
                  missing = local - remote
                  if not missing:
                      print(f"OK: {len(remote)} arquivos publicados na {version}")
                      sys.exit(0)
              else:
                  missing = local
              print(f"tentativa {attempt + 1}: faltam {len(missing)}")
              time.sleep(20)
          print("::error::faltaram arquivos no PyPI:")
          for name in sorted(missing):
              print(f"  - {name}")
          sys.exit(1)
          PY
