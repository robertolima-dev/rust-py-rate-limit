[build-system]
# Piso 1.14 de propósito: versões anteriores não emitem o `License-Expression`
# do PEP 639, e a 0.2.1 foi ao PyPI sem metadado de licença nenhum (ver P1-4).
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "rust-py-rate-limit"
version = "0.2.2"
description = "Fast local rate limiting for Python, powered by Rust."
readme = "README.md"
requires-python = ">=3.10"
# Forma do PEP 639: expressão SPDX + arquivos de licença declarados. A forma
# antiga (`{ file = "LICENSE" }`) despejava o texto inteiro no campo `License`,
# e o classifier "License :: OSI Approved" saiu — é mutuamente exclusivo com
# License-Expression no Metadata 2.4.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Roberto Lima", email = "robertolima.izphera@gmail.com" }]
keywords = [
    "rate-limit",
    "rate-limiting",
    "throttle",
    "rust",
    "pyo3",
    "fastapi",
    "django",
    "flask",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/robertolima-dev/rust-py-rate-limit"
Repository = "https://github.com/robertolima-dev/rust-py-rate-limit"
Issues = "https://github.com/robertolima-dev/rust-py-rate-limit/issues"

[project.optional-dependencies]
dev = ["pytest", "fastapi", "uvicorn", "django", "httpx", "starlette"]

[tool.maturin]
python-source = "python"
module-name = "rust_py_rate_limit._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
